<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#193f39"><title>会前 · 会议提醒</title><style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#203b35;background:#f5f4ee}*{box-sizing:border-box}body{margin:0}header,main{max-width:1120px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d9dfd5}.brand{font-size:24px;font-weight:800}.brand span{color:#849b6b}button,a,input,select{font:inherit}button,.link{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;background:#214b40;color:white}button.secondary{background:#e6ebdf;color:#294c40}h1{font-size:clamp(36px,6vw,64px);letter-spacing:-2px;margin:22px 0}p{line-height:1.7;color:#657269}.hero{padding:30px 0}.eyebrow{font-size:12px;letter-spacing:3px;color:#7a8f63;font-weight:700}.layout{display:grid;grid-template-columns:1fr 340px;gap:28px}.panel,.meeting{background:#fff;border:1px solid #e0e4db;border-radius:20px;padding:25px}.panel{height:fit-content}h2{margin:0 0 22px;font-size:20px}label{display:block;font-size:13px;margin:16px 0 7px}input,select{width:100%;padding:12px;border:1px solid #d7ded4;border-radius:9px;background:#fcfcf9;color:#263e34}form button{width:100%;margin-top:22px}.meeting{margin-bottom:16px;position:relative}.meeting h3{font-size:22px;margin:12px 0}.tag{font-size:12px;background:#edf1e6;border-radius:30px;padding:5px 10px;color:#557541}.meta{font-size:14px;color:#69756b;line-height:1.9;overflow-wrap:anywhere}.actions{display:flex;gap:10px;margin-top:20px}.actions button{padding:8px 12px;font-size:13px}.count{float:right;font-size:13px;color:#507b56}.empty{text-align:center;padding:65px 24px;background:#e9eee2;border-radius:20px}.empty b{font-size:22px}.section-head{display:flex;justify-content:space-between;align-items:center}.section-head span{color:#7d8979;font-size:13px}footer{padding:38px 0;font-size:12px;color:#7d8979}#status{font-size:13px;max-width:450px} @media(max-width:760px){.layout{grid-template-columns:1fr}.panel{grid-row:1}header,main{padding:20px}header button{font-size:12px;padding:10px}.count{float:none;display:block;margin-top:12px}}
</style></head><body><header><div class="brand">◷ 会前<span> .</span></div><button class="secondary" id="notify">开启浏览器提醒</button></header><main><section class="hero"><div class="eyebrow">MAKE ROOM FOR WHAT MATTERS</div><h1>重要的相聚，<br>每一次都准时。</h1><p>把会议记在这里，让时间井然有序。<br>添加日程、掌握倒计时，轻松准备下一场交流。</p><p id="status" role="status"></p></section><div class="layout"><section><div class="section-head"><h2>我的会议</h2><span id="total"></span></div><div id="list"></div></section><aside class="panel"><h2>＋ 添加一场会议</h2><form id="form"><label for="title">会议名称 *</label><input id="title" required maxlength="120" placeholder="例如：研究小组讨论"><label for="date">开始时间 *</label><input id="date" type="datetime-local" required><label for="place">地点或会议链接</label><input id="place" maxlength="500" placeholder="会议室 / Zoom / Teams"><label for="reminder">提前提醒</label><select id="reminder"><option value="5">提前 5 分钟</option><option value="15" selected>提前 15 分钟</option><option value="30">提前 30 分钟</option><option value="60">提前 1 小时</option></select><button type="submit">保存会议 ↗</button></form><p style="font-size:12px">时间以设备当地时区为准。网页开启时才能触发浏览器提醒；导出日历可获得系统日历提醒。</p></aside></div><footer>会前 · 留一点从容给自己。<br>数据仅保存在此浏览器，清除浏览器数据会删除会议。请导出日历以备份。</footer></main><script>
const $=id=>document.getElementById(id);let meetings=[];try{meetings=JSON.parse(localStorage.getItem('huiqian-meetings')||'[]');if(!Array.isArray(meetings))meetings=[]}catch{$('status').textContent='无法读取已保存的会议。'}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem('huiqian-meetings',JSON.stringify(meetings));return true}catch{$('status').textContent='浏览器无法保存数据，请导出日历备份。';return false}}
function render(){const sorted=[...meetings].sort((a,b)=>a.time-b.time);$('total').textContent=sorted.filter(m=>m.time>Date.now()).length+' 场待开始';$('list').innerHTML=sorted.length?sorted.map(m=>{let delta=m.time-Date.now(),minutes=Math.ceil(delta/60000);let count=delta<0?'已开始':minutes<60?minutes+' 分钟后':minutes<1440?Math.floor(minutes/60)+' 小时 '+minutes%60+' 分钟后':Math.floor(minutes/1440)+' 天后';return `<article class="meeting"><span class="tag">${delta<0?'过往会议':'即将相聚'}</span><span class="count">${count}</span><h3>${esc(m.title)}</h3><div class="meta">◷ ${esc(new Date(m.time).toLocaleString('zh-CN',{dateStyle:'full',timeStyle:'short'}))}<br>⌖ ${esc(m.place||'地点待定')}<br>提前 ${m.reminder} 分钟提醒</div><div class="actions"><button class="secondary" data-export="${esc(m.id)}">导出日历 ↗</button><button class="secondary" data-delete="${esc(m.id)}">删除</button></div></article>`}).join(''):'<div class="empty"><p style="font-size:38px">◷</p><b>下一次相聚，从这里开始</b><p>添加第一场会议，给忙碌的日程一点秩序。</p></div>'}
$('form').onsubmit=e=>{e.preventDefault();const time=new Date($('date').value).getTime(),title=$('title').value.trim();if(!title||!Number.isFinite(time)||time<=Date.now()){ $('status').textContent='请填写会议名称，并选择未来的开始时间。';return}meetings.push({id:crypto.randomUUID(),title,time,place:$('place').value.trim(),reminder:Number($('reminder').value),notified:false});save();render();$('form').reset();$('status').textContent='会议已添加。可导出到日历以设置系统提醒。'};
$('notify').onclick=async()=>{if(!('Notification'in window)){$('status').textContent='此浏览器不支持通知，请导出日历。';return}try{const permission=await Notification.requestPermission();$('status').textContent=permission==='granted'?'浏览器提醒已开启，请保持此网页打开。':'通知未获允许。你仍可以导出会议到日历。'}catch{$('status').textContent='无法开启通知，请导出会议到日历。'}};
function icsText(s){return String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,')}
function stamp(t){return new Date(t).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}
$('list').onclick=e=>{let id=e.target.dataset.delete;if(id){meetings=meetings.filter(m=>m.id!==id);save();render()}id=e.target.dataset.export;if(id){const m=meetings.find(m=>m.id===id);const content=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Huiqian//Meeting Reminder//ZH','BEGIN:VEVENT','UID:'+m.id+'@huiqian','DTSTAMP:'+stamp(Date.now()),'DTSTART:'+stamp(m.time),'DTEND:'+stamp(m.time+3600000),'SUMMARY:'+icsText(m.title),'LOCATION:'+icsText(m.place),'BEGIN:VALARM','TRIGGER:-PT'+m.reminder+'M','ACTION:DISPLAY','DESCRIPTION:会议提醒','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');const url=URL.createObjectURL(new Blob([content],{type:'text/calendar;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='meeting.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}};
function tick(){for(const m of meetings){if(!m.notified&&m.time>Date.now()&&m.time-Date.now()<=m.reminder*60000){$('status').textContent='会议即将开始：'+m.title;if('Notification'in window&&Notification.permission==='granted'){try{new Notification('会议提醒：'+m.title,{body:new Date(m.time).toLocaleString()+' '+m.place});m.notified=true;save()}catch{}}}}render()}render();tick();setInterval(tick,15000);
</script></body></html>
