name: Check sources, discover conferences and publish website

on:
  push:
    branches: [main]
    paths:
      - index.html
      - config.json
      - assets/**
      - data/**
      - scripts/**
      - tests/**
      - google-apps-script/**
      - package.json
      - .github/workflows/site.yml
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      refresh_sources:
        description: Check official conference pages before publishing
        type: boolean
        default: true
      discover_conferences:
        description: Search the web for possible new conferences
        type: boolean
        default: true

concurrency:
  group: conference-reminder-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  website:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test reminder rules
        run: node --test tests/*.test.mjs
      - name: Test source update rules
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate published catalogue
        run: python scripts/validate_catalog.py
      - name: Check registered official sources
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_sources)
        run: |
          python scripts/update_catalog.py --dump-text _source-text
          python scripts/review_backlog.py
      - name: Keep fingerprinted source text for manual review
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_sources)
        uses: actions/upload-artifact@v4
        with:
          name: source-text
          path: _source-text
          retention-days: 7
      - name: Discover possible new conferences
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.discover_conferences)
        env:
          YOU_API_KEY: ${{ secrets.YOU_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: python scripts/discover_conferences.py
      - name: Commit checked data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.refresh_sources || inputs.discover_conferences))
        run: |
          git add data/conferences.json data/source-checks.json data/discovered-conferences.json data/review-progress.json
          if git diff --cached --quiet; then
            echo "No catalogue changes to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update official conference checks'
          pushed=
          for attempt in 1 2 3 4; do
            git fetch origin main
            # Re-validate the rebased data: another commit may have changed the
            # same files, and only a valid merged catalogue may be pushed.
            if git rebase origin/main && python scripts/validate_catalog.py && git push origin HEAD:main; then
              pushed=1
              break
            fi
            git rebase --abort || true
            sleep $((attempt * 4))
          done
          if [ -z "$pushed" ]; then
            # Never publish the unpushed bot data: it could hide a newer edit on
            # main. Publish exactly what main contains instead.
            git rebase --abort || true
            git reset --hard origin/main
            echo "::warning::Could not push catalogue updates onto main; publishing the current main branch without this run's updates."
          fi
      - name: Validate the data about to be published
        run: python scripts/validate_catalog.py
      - name: Assemble public website only
        run: |
          mkdir -p _site
          cp index.html config.json _site/
          cp -R assets data _site/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
