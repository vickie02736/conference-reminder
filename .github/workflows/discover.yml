name: Discover - check official sources and search for new conferences

# Runs at 01:00 London time every day. GitHub cron is UTC-only, so both
# candidate UTC times are scheduled and the "timing" job keeps only the one
# that is 01:00 in London today (00:00 UTC in summer, 01:00 UTC in winter).
# The Claude nightly review starts at 02:00 London time, reads these results,
# and proposes verified catalogue changes as a pull request.

on:
  schedule:
    - cron: '0 0 * * *'   # 01:00 London during British Summer Time
    - cron: '0 1 * * *'   # 01:00 London during GMT
  workflow_dispatch:
    inputs:
      refresh_sources:
        description: Check official conference pages
        type: boolean
        default: true
      discover_conferences:
        description: Search the web for possible new conferences
        type: boolean
        default: true

concurrency:
  group: conference-discovery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  timing:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          offset=$(TZ=Europe/London date +%z)
          case "$offset|$SCHEDULE" in
            "+0100|0 0 * * *"|"+0000|0 1 * * *") run=true ;;
            *) run=false ;;
          esac
          echo "London offset $offset, schedule '$SCHEDULE' -> run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  collect:
    needs: timing
    if: needs.timing.outputs.run == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test reminder rules
        run: node --test tests/*.test.mjs
      - name: Test source update rules
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate catalogue
        run: python scripts/validate_catalog.py
      - name: Check registered official sources
        if: github.event_name == 'schedule' || inputs.refresh_sources
        run: |
          python scripts/update_catalog.py --dump-text _source-text
          python scripts/review_backlog.py
      - name: Keep fingerprinted source text for manual review
        if: github.event_name == 'schedule' || inputs.refresh_sources
        uses: actions/upload-artifact@v4
        with:
          name: source-text
          path: _source-text
          retention-days: 7
      - name: Discover possible new conferences
        if: github.event_name == 'schedule' || inputs.discover_conferences
        env:
          YOU_API_KEY: ${{ secrets.YOU_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: python scripts/discover_conferences.py
      - name: Commit checked data
        run: |
          git add data/conferences.json data/source-checks.json data/discovered-conferences.json data/review-progress.json
          if git diff --cached --quiet; then
            echo "No catalogue changes to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update official conference checks'
          for attempt in 1 2 3 4; do
            git fetch origin main
            # Re-validate the rebased data: only a valid merged catalogue may be pushed.
            if git rebase origin/main && python scripts/validate_catalog.py && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 4))
          done
          echo "::warning::Could not push this run's catalogue updates onto main."

  # A push made with GITHUB_TOKEN does not trigger other workflows, so the
  # refreshed check data is published explicitly here.
  publish:
    needs: collect
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
